    <script>
        /* ----------------------------------------------------
           1. SAKURA & STAR PARTICLES CANVAS
        ---------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('sakura-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const particles = [];
            const particleCount = 40;

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = -20;
                    this.size = Math.random() * 8 + 4;
                    this.speedY = Math.random() * 1.5 + 0.8;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = Math.random() * 2 - 1;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.color = Math.random() > 0.3 ? '#ffb7c5' : '#8a2be2';
                }

                update() {
                    this.y += this.speedY;
                    this.x += this.speedX + Math.sin(this.y / 30) * 0.5;
                    this.rotation += this.rotationSpeed;

                    if (this.y > canvas.height + 20) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate((this.rotation * Math.PI) / 180);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;

                    // Draw petal shape
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
                    ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
                    ctx.fill();

                    ctx.restore();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                const p = new Particle();
                p.y = Math.random() * canvas.height; // scatter initially
                particles.push(p);
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animateParticles);
            }

            animateParticles();
        });

        /* ----------------------------------------------------
           2. WEB AUDIO API SYNTHESIZER (LO-FI / AMBIENT CHORDS)
        ---------------------------------------------------- */
        class LofiSynthesizer {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.timer = null;
                this.step = 0;
                
                // Dreamy chord progression (Fmaj7 -> Em7 -> Dm7 -> Cmaj7 / Am)
                this.chords = [
                    [174.61, 220.00, 261.63, 329.63], // Fmaj7 (F3, A3, C4, E4)
                    [164.81, 196.00, 246.94, 293.66], // Em7   (E3, G3, B3, D4)
                    [146.83, 174.61, 220.00, 261.63], // Dm7   (D3, F3, A3, C4)
                    [130.81, 164.81, 196.00, 246.94]  // Cmaj7 (C3, E3, G3, B3)
                ];
                
                // Gentle pentatonic melody notes for cozy vibe
                this.melodyNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type = 'sine', duration = 1.5, gainVal = 0.08, attack = 0.1, decay = 0.5) {
                if (!this.ctx) return;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                // Smooth envelope to sound soft & aesthetic
                const now = this.ctx.currentTime;
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(gainVal, now + attack);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);
            }

            start() {
                this.init();
                this.isPlaying = true;
                this.step = 0;

                // Loop musical sequence
                const playStep = () => {
                    if (!this.isPlaying) return;

                    // Play ambient chord pads
                    const chord = this.chords[this.step % this.chords.length];
                    chord.forEach(freq => {
                        this.playTone(freq, 'triangle', 3.5, 0.04, 0.4, 2.0);
                    });

                    // Random atmospheric melody note
                    if (Math.random() > 0.3) {
                        const note = this.melodyNotes[Math.floor(Math.random() * this.melodyNotes.length)];
                        setTimeout(() => {
                            if (this.isPlaying) {
                                this.playTone(note, 'sine', 1.8, 0.05, 0.05, 1.2);
                            }
                        }, Math.random() * 800);
                    }

                    this.step++;
                    this.timer = setTimeout(playStep, 2400); // tempo pace
                };

                playStep();
            }

            stop() {
                this.isPlaying = false;
                if (this.timer) clearTimeout(this.timer);
            }
        }

        const audioSynth = new LofiSynthesizer();

        /* ----------------------------------------------------
           3. GACHA SYSTEM DATA & LOGIC
        ---------------------------------------------------- */
// ... existing code ...
        /* ----------------------------------------------------
           4. AUDIO TOGGLE LOGIC
        ---------------------------------------------------- */
        const audioBtn = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');
        const audioStatus = document.getElementById('audio-status');

        audioBtn.addEventListener('click', () => {
            if (!audioSynth.isPlaying) {
                audioSynth.start();
                audioIcon.className = "fas fa-pause text-lg text-sakura animate-pulse";
                audioStatus.textContent = "Музыка ON";
            } else {
                audioSynth.stop();
                audioIcon.className = "fas fa-play text-lg";
                audioStatus.textContent = "Музыка OFF";
            }
        });
    </script>
